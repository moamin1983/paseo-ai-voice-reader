name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        paseo-sdk: ['0.11.4', '0.12.0', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select compatibility SDK
        if: matrix.paseo-sdk != '0.12.0'
        env:
          PASEO_SDK_VERSION: ${{ matrix.paseo-sdk }}
        run: npm install --no-save --package-lock=false --ignore-scripts "@getpaseo/plugin@$PASEO_SDK_VERSION" "@getpaseo/client@$PASEO_SDK_VERSION" "@getpaseo/protocol@$PASEO_SDK_VERSION"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:check
      - run: npm pack --dry-run --ignore-scripts
