name: Bug report
description: Report a reproducible plugin problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior. Use public sample text; omit private transcripts and credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Paseo version, OS, plugin version, provider and speech backend.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant error text or a screenshot using sample data. Do not attach settings dumps or secrets.
